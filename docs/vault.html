<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Vault & Course Library | AI Graphic TV</title>
<style>
:root{--bg:#060B14;--card:#0F1A2C;--line:#1d2b44;--fg:#F1F5F9;--mute:#9fb0cc;--cyan:#22D3EE;--gold:#F59E0B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:36px 20px 18px;max-width:1000px;margin:auto}h1{margin:0 0 6px;font-size:30px}h1 span{color:var(--gold)}
p.sub{color:var(--mute);margin:0 0 18px}main{max-width:1000px;margin:auto;padding:0 20px 60px}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:18px}.card p{margin:0;color:var(--mute);font-size:14px}.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--cyan);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.btns{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}a.b{padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px}
a.pri{background:var(--gold);color:#1a1100}a.sec{border:1px solid var(--line);color:var(--fg)}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:24px 0}
.offer{background:linear-gradient(160deg,#13223b,#0F1A2C);border:1px solid var(--gold);border-radius:16px;padding:18px}
.offer b{font-size:20px;color:var(--gold)}.empty,.disc{color:var(--mute);font-size:13px;margin-top:20px}
</style></head><body>
<header><h1>PDF Vault <span>&amp; Course Library</span></h1>
<p class="sub">Every AI Graphic TV episode playbook: step-by-step, prompts and checklists. Free to download.</p>
<input id="q" placeholder="Search guides: tool, topic, keyword" aria-label="Search guides"></header>
<main><div id="offers" class="offers"></div><div id="grid" class="grid"></div><div id="empty" class="empty"></div><div id="disc" class="disc"></div></main>
<script>
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let V={guides:[],offers:[]};
function offerHtml(){document.getElementById('offers').innerHTML=(V.offers||[]).map(o=>`<div class="offer"><b>${esc(o.price)}</b> ${esc(o.name)}<p>${esc(o.pitch)}</p><div class="btns"><a class="b pri" href="${esc(o.url)}" rel="noopener">Get it</a></div></div>`).join('');}
function draw(){const q=document.getElementById('q').value.toLowerCase().trim();
 const gs=V.guides.filter(g=>!q||(g.title+' '+g.summary+' '+(g.tags||[]).join(' ')).toLowerCase().includes(q));
 document.getElementById('grid').innerHTML=gs.map(g=>`<div class="card"><h3>${esc(g.title)}</h3><p>${esc(g.summary)}</p>
  <div class="tags">${(g.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  <div class="btns"><a class="b pri" href="${esc(g.pdf_url)}" download rel="noopener">Download PDF</a>${g.youtube_url?`<a class="b sec" href="${esc(g.youtube_url)}" rel="noopener">Watch video</a>`:''}</div></div>`).join('');
 document.getElementById('empty').textContent=gs.length?'':(V.guides.length?'No guide matches your search.':'The first guides are being approved. Check back soon.');}
fetch('vault/vault.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{V=d;offerHtml();draw();
 document.getElementById('disc').textContent=(d.affiliates&&d.affiliates.length)?d.disclosure:'';}).catch(()=>{document.getElementById('empty').textContent='Could not load the vault.'});
document.getElementById('q').addEventListener('input',draw);
</script></body></html>
