name: gates
on:
  push:
    branches: [main]
    paths: ['state.json', 'docs/calendar.json']
  workflow_dispatch:
    inputs:
      mode: { description: 'notify or calendar', default: 'notify' }
permissions:
  contents: write
concurrency:
  group: gates
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Run
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE }}
        run: |
          python3 pipeline/gates/gates.py ${{ github.event.inputs.mode || 'notify' }}
      - name: Save
        if: always()
        run: |
          git config user.name "growth-bot"; git config user.email "growth-bot@users.noreply.github.com"
          git add -A -- data/gates_notified.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "gates: notified"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done; exit 1
